<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 35px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
            color: #333;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #555;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 14px;
            transition: 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102,126,234,0.4);
        }

        .btn-group {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: 0.2s;
        }

        .btn-save {
            background: linear-gradient(135deg, #28a745, #218838);
            color: white;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .btn-back {
            background: #6c757d;
            color: white;
            text-align: center;
            line-height: 42px;
        }

        .btn-back:hover {
            background: #5a6268;
        }

    </style>
</head>

<body>

<div class="card">

    <h2 th:text="${isEdit} ? '✏️ Chỉnh sửa sinh viên' : '➕ Thêm sinh viên'"></h2>

    <form th:action="${isEdit} ? @{/students/update} : @{/students/save}"
          th:object="${student}"
          method="post">

        <input type="hidden" th:if="${isEdit}" th:field="*{id}" />

        <div class="form-group">
            <label>Họ và tên</label>
            <input type="text" th:field="*{name}" placeholder="Nhập họ tên" required />
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" th:field="*{email}" placeholder="Nhập email" required />
        </div>

        <div class="form-group">
            <label>Tuổi</label>
            <input type="number" th:field="*{age}" placeholder="Nhập tuổi" required />
        </div>

        <div class="btn-group">
            <a th:href="@{/students}" class="btn btn-back">⬅ Quay lại</a>

            <button type="submit"
                    class="btn btn-save"
                    th:text="${isEdit} ? 'Cập nhật' : 'Lưu sinh viên'">
            </button>
        </div>

    </form>
</div>

</body>
</html>
